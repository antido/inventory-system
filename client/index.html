<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27><rect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%234f46e5%27/><path d=%27M9 12l7-4 7 4v8l-7 4-7-4z%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272%27/></svg>" />
    <title>StockFlow Inventory</title>
    <script>
      // Apply the saved (or device) theme before the page paints, so dark mode doesn't flash white.
      // Same logic as src/context/ThemeContext.tsx.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('inventory_theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
